# MipLinux · 内核 VT（tty1..ttyN）的字体与键盘布局
#
# 只影响裸 tty。图形会话和终端模拟器里的字体走 fontconfig
# （见 etc/fonts/local.conf），两者互不相干。
#
# KEYMAP：kbd 里没有 cn/zh 键盘布局（本机 kbd 2.10.0 实测），中文用拼音输入，
#   us 布局即可。
# FONT：来自 terminus-font（已在 packages.x86_64，不必新增包），取值对应
#   /usr/share/kbd/consolefonts/<FONT>.psf.gz，按屏幕密度三选一：
#     ter-116n   8x16   1080p 及以下（≈内核默认字号）
#     ter-124n   8x24   1080p / 2K 折中
#     ter-132n   8x32   高分屏（当前取值）
#   注意：内核 VT 单个字体最多 512 个字形，放不下汉字，tty 下的中文必然是方块。
#   这不是本文件能解决的，中文渲染交给图形会话。
KEYMAP=us
FONT=ter-132n
