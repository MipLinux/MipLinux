<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  MipLinux · 中文 fallback 顺序

  为什么需要：noto-fonts-cjk 一个包里同时装着 SC/TC/JP/KR 四套汉字字形，
  fontconfig 是按 charset 命中做兜底的，实测（宿主同款字体包）默认会给到
  "Noto Sans CJK KR" —— 汉字写法是韩式/日式的，中英混排的字重也对不上。
  这里用 lang=zh-cn 把简体字形钉死。

  生效前提：
    · /etc/fonts/fonts.conf 的 include 顺序是 conf.d/ → local.conf，
      所以本文件能压过 49-sansserif.conf / 65-nonlatin.conf 的默认偏好。
    · 依赖包清单里有 noto-fonts-cjk（家族名 Noto Sans / Serif / Mono CJK SC）。
      缺包不会报错，只会静默退回默认行为 —— 很难查，别删包不删配置。
    · emoji 不用在这里配：fontconfig 自带的 45-generic.conf 已把
      Noto Color Emoji 接进兜底链（实测 fc-match "sans-serif:charset=1F600"
      直接返回 Noto Color Emoji），包清单里有 noto-fonts-emoji 就够。

  有意为之的副作用：lang=zh-cn 的文本里，拉丁字母也会用 Noto Sans CJK SC 的
  拉丁字形（Source Sans 系），换来中英混排字重一致。
  没有 lang 信息的程序（少数工具包）仍可能拿到 KR/JP 字形；要彻底钉死得无条件
  prepend，代价是英文界面也换字体，当前不做。
-->
<fontconfig>

  <!-- 简体中文：sans-serif / serif / monospace 都优先简体字形 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- 终端：等宽字体没有汉字覆盖时中文就是方块，这一条同样必要 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

</fontconfig>
