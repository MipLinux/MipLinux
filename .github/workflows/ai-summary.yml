name: Issue review（受理前质检 + 所有权雷达）

# 这个 workflow 补的是 docs/work/README.md 自己写明的缺口：
#   「它查不到发出去之后的 issue……这件事只在草案阶段拦得住，发布之后靠人看。」
#
# 分工（Issue #98）：
#   scripts/ai-review-context.sh  算**集合**：路径解析、硬撞 / 软邻近、解析回显
#   模型                          判**语义**：判据质量、查重、引用有效性
#   判据的唯一源                  docs/work/ai-review-rubric.md（那份文档就是 system prompt）
#
# 文件名仍叫 ai-summary.yml（Issue #98 的实现点名了这个路径）：改名会把这次改动从「换行为」
# 变成「搬文件 + 换行为」，仓库的规矩是一个 PR 只做一件事。要改名另开一条。

on:
  issues:
    # edited 也要跑：人按提示改完正文得能再查一遍；正文没变时下面会直接跳过，不会重复评论
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  review:
    # 仓库已公开，任何人都能开 issue 触发一次真实的 DeepSeek 调用并公开评论。
    # 只对与本仓库有关联的人生效。
    #
    # 注意 CONTRIBUTOR 必须保留：实测本仓库里作者是组织 owner 时，事件负载给的也是
    # CONTRIBUTOR（同一 issue 的 REST API 却报 MEMBER，两者不一致）。
    # 真正要挡的是 FIRST_TIMER / FIRST_TIME_CONTRIBUTOR / NONE 这类陌生人。
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 生成上下文（脚本算集合）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        # 产物写进工作区而不是 /tmp：下面那个 action 是 **Docker action**，WORKDIR 是 /app，
        # runner 的 /tmp 不与容器共享；只有工作区挂在容器的 /github/workspace。
        run: |
          set -euo pipefail
          ./scripts/ai-review-context.sh --issue "$ISSUE" --out "$GITHUB_WORKSPACE/.ai-review"

      - name: 正文没变就不重复评论
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          sha=$(sed -n 's/.*· 正文 \([0-9a-f]\{8\}\)）.*/\1/p' .ai-review/facts.md | head -1)
          [ -n "$sha" ] || { echo "::error::facts.md 里读不到正文 sha"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

          # 找我们之前发的那条（靠 marker），比正文 sha 决定是「就地编辑」还是「新建」。
          # 找不到 marker 就当没有 —— 宁可多发一条，也不误改别人的评论。
          old=$(gh api "repos/{owner}/{repo}/issues/$ISSUE/comments" --paginate \
                  -q '.[] | select(.body | contains("mipl-review: body=")) | .id' | tail -1 || true)
          echo "comment_id=$old" >>"$GITHUB_OUTPUT"
          if [ -n "$old" ]; then
            oldsha=$(gh api "repos/{owner}/{repo}/issues/comments/$old" -q .body \
                       | sed -n 's/.*mipl-review: body=\([0-9a-f]\{8\}\).*/\1/p' | head -1)
            if [ "$oldsha" = "$sha" ]; then
              echo "skip=true" >>"$GITHUB_OUTPUT"
              echo "正文没变（$sha），跳过。"
            else
              echo "skip=false" >>"$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: 语义判断（AI 判语义）
        id: ai
        if: steps.gate.outputs.skip != 'true'
        # 不要用浮动的 @v1：它仍指向 v1.3.1，其镜像以 uid 1000 运行，
        # 无权写入 runner 的 GITHUB_OUTPUT（挂载在 /github/file_commands），
        # 会报 "failed to set output: ... permission denied"。v1.4.0 起容器改回 root，已修复。
        uses: appleboy/LLM-action@v1.4.0
        with:
          base_url: 'https://api.deepseek.com'
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          model: 'deepseek-v4-flash'
          # 判断类任务要压温度：同一份正文跑三次，四块的档位不该变（rubric 的抖动断言）
          temperature: '0.2'
          # 默认 1000 会把四块输出截断；判断类输出长度不可控，留足余量（模型自带 max_tokens 上限保护）
          max_tokens: '8000'
          # 路径必须是**容器内**的工作区挂载点：这个 action 是 Docker action，WORKDIR 是 /app，
          # 相对路径会落到 /app 下；runner 的 $GITHUB_WORKSPACE 在容器里叫 /github/workspace。
          system_prompt: 'file:///github/workspace/docs/work/ai-review-rubric.md'
          input_prompt: 'file:///github/workspace/.ai-review/context.md'

      - name: 发评论（新建或就地编辑）
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ steps.gate.outputs.comment_id }}
          SHA: ${{ steps.gate.outputs.sha }}
          SEMANTIC: ${{ steps.ai.outputs.response }}
        run: |
          set -euo pipefail
          {
            cat .ai-review/facts.md
            echo
            if [ -n "$SEMANTIC" ]; then
              printf '%s\n' "$SEMANTIC"
            else
              # 确定性的那半仍然发出去：它是脚本算的，跟模型无关
              echo "⚠️ 语义判断（判据质检 / 查重 / 引用有效性）本次没有输出，上面只有脚本算出的确定性事实。"
            fi
            # 免责落在整条评论的**末尾**（facts.md 里不写：那样会插在模型那三块前面）
            echo
            echo '---'
            echo '本评论由 `scripts/ai-review-context.sh` 按 `docs/work/ai-review-rubric.md` 生成：**只对账，不裁决**，不打 label、不改状态、不代表受理生效。'
            printf '（作者关联：%s）\n' "$(awk -F'\t' '$1=="author_association"{print $2}' .ai-review/meta.tsv)"
            echo
            printf '<!-- mipl-review: body=%s -->\n' "$SHA"
          } >.ai-review/comment.md

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/{owner}/{repo}/issues/comments/$COMMENT_ID" \
              -f body="$(cat .ai-review/comment.md)" >/dev/null
            echo "已就地更新评论 $COMMENT_ID"
          else
            gh api -X POST "repos/{owner}/{repo}/issues/$ISSUE/comments" \
              -f body="$(cat .ai-review/comment.md)" >/dev/null
            echo "已新建评论"
          fi

          # 模型没输出要让这次运行变红 —— 评论发出去了，但「语义那半没跑」不能悄悄过去
          [ -n "$SEMANTIC" ] || exit 1
