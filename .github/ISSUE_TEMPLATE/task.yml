# 本文件是 MipLinux/.github（组织级）中同名文件的副本，内容保持一致。
# 原因：组织级 ISSUE_TEMPLATE 在本仓库实测不生效（New issue 选择页空白），
# 而仓库级模板一定会显示。修改请先改组织级，再同步到这里。
name: 工作分配
description: 维护者/协作者领取的一条工作：目标、改哪些文件、验收判据、要交什么证据
title: "[工作] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        一条工作 = 一个 issue。**验收写不出来就别开** —— 写不出判据，说明这件事还没想清楚。

        字段为什么这么切、发布流程、角色到人的对应，见
        [工作 issue 规范](https://github.com/MipLinux/MipLinux/blob/main/docs/work/README.md)；
        骨架样板见 [TEMPLATE.md](https://github.com/MipLinux/MipLinux/blob/main/docs/work/TEMPLATE.md)。

        > 本表单公开可见，谁都可以起草。**受理人角色只是候选**，由维护者确认后才生效。

  - type: dropdown
    id: assignee-role
    attributes:
      label: 受理人
      description: 只填角色，不写人名 —— 角色到人的对应只在 docs/work/README.md 维护一份。
      options:
        - 维护者
        - 协作者 A
        - 协作者 B
    validations:
      required: true

  - type: input
    id: goal
    attributes:
      label: 目标
      description: 一句话，写「什么从不能变成能 / 从错变成对」，不写做法。
      placeholder: 例如：装后系统里的 CJK 字体不再依赖 Live 清单，装完即可显示中文。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实现
      id: implement
      description: |
        做什么、**改哪些文件（逐个写路径）**、明确**不**做什么。
        路径写出来，所有权才切得开 —— 撞在同一批文件上的两条线没法并行。
      placeholder: |
        改 installer/backend/mipl_installer/configure.py 的 vconsole_conf()；
        不碰 profile/packages.x86_64（那是另一条线）。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 验收
      id: acceptance
      description: |
        能在本机跑出来的判据：**命令 + 期望结果**。
        没有实测证据不许写「已验证」，只能写 未实测 / 仅静态检查 / 仅 dry-run。
      placeholder: |
        `./scripts/check-work-issue.sh` → 退出码 0；
        `sudo ./scripts/mipl.sh qemu --disk target.qcow2 --boot c` → 进系统后 `locale` 输出 zh_CN.UTF-8。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 回报
      id: report
      description: 做完交什么、给谁 —— 命令输出、文件路径、实测截图，写清楚。
      placeholder: 例如：把 check-work-issue.sh 的完整输出贴在 issue 下，并 @ 维护者过目。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 依赖
      id: depends-on
      description: 被哪个 issue / P 编号 / 里程碑卡住；没有就写「无」。
      placeholder: 无
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        **开工前请执行：**

        ```bash
        git switch main && git pull origin main
        git switch -c feat/<主题>   # 只改文档用 docs/<主题>
        ```

        > 分支不在 `main` 上、或拉取不是快进 → 停下来问维护者，**不要**自行 `merge` / `rebase` / `reset --hard`。
